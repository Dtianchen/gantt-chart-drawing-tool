name: 自动发布

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 构建生产版本
        run: npm run build

      - name: 打包 Electron 应用
        run: npm run electron:build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gantt-chart-tool
          path: ../gantt-exe/