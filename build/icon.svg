<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="100%" stop-color="#7C5CBE"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#bg)"/>
  
  <!-- Time axis -->
  <rect x="32" y="40" width="192" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Task bars -->
  <!-- Bar 1 - Teal -->
  <rect x="48" y="68" width="100" height="24" rx="6" fill="url(#bar1)"/>
  <circle cx="148" cy="80" r="8" fill="#fff"/>
  
  <!-- Bar 2 - Yellow -->
  <rect x="72" y="108" width="140" height="24" rx="6" fill="url(#bar2)"/>
  
  <!-- Bar 3 - Pink -->
  <rect x="96" y="148" width="80" height="24" rx="6" fill="url(#bar3)"/>
  
  <!-- Milestone diamond -->
  <rect x="200" y="172" width="20" height="20" rx="2" fill="#fff" transform="rotate(45 210 182)"/>
  
  <!-- Today line -->
  <line x1="160" y1="56" x2="160" y2="200" stroke="#fff" stroke-width="3" stroke-dasharray="8 4" stroke-opacity="0.6"/>
  
  <!-- Decorative grid dots -->
  <circle cx="48" cy="200" r="4" fill="rgba(255,255,255,0.5)"/>
  <circle cx="80" cy="200" r="4" fill="rgba(255,255,255,0.5)"/>
  <circle cx="112" cy="200" r="4" fill="rgba(255,255,255,0.5)"/>
</svg>
